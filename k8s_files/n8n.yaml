apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${app_name}-n8n-pgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ${app_name}-n8n-pgres
  template:
    metadata:
      labels:
        app: ${app_name}-n8n-pgres
    spec:
      initContainers:
        - name: fix-permissions
          image: busybox
          command: ["sh", "-c", "chmod 777 /var/lib/postgresql/data && chown 999:999 /var/lib/postgresql/data"]
          securityContext:
            runAsUser: 0
            privileged: true
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
              subPath: postgres
      containers:
        - name: postgres
          image: ${n8n_image_pgres}
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: "${N8N_SIDE_POSTGRES_USER}"
            - name: POSTGRES_PASSWORD
              value: "${N8N_SIDE_POSTGRES_PASSWORD}"
            - name: POSTGRES_DB
              value: "${N8N_SIDE_POSTGRES_DB}"
            - name: POSTGRES_INITDB_ARGS
              value: "${N8N_SIDE_POSTGRES_INITDB_ARGS}"
          securityContext:
            runAsUser: 999
            runAsGroup: 999
          resources:
            requests:
              cpu: "50m"
              memory: "128M"
            limits:
              cpu: "1000m"
              memory: "512M"
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
              subPath: postgres
      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: n8n-data
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${app_name}-n8n
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ${app_name}-n8n
  template:
    metadata:
      labels:
        app: ${app_name}-n8n
    spec:
      containers:
        - name: ${app_name}-n8n
          image: ${n8n_image}
          ports:
            - containerPort: 5678
          env:
            - name: N8N_HOST
              value: "${N8N_HOST}"
            - name: N8N_PORT
              value: "${N8N_PORT}"
            - name: N8N_PROTOCOL
              value: "${N8N_PROTOCOL}"
            - name: N8N_SECURE_COOKIE
              value: "${N8N_SECURE_COOKIE}"
            - name: NODE_ENV
              value: "${N8N_NODE_ENV}"
            - name: DB_TYPE
              value: "${N8N_DB_TYPE}"
            - name: DB_POSTGRESDB_HOST
              value: "${N8N_DB_POSTGRESDB_HOST}"
            - name: DB_POSTGRESDB_PORT
              value: "${N8N_DB_POSTGRESDB_PORT}"
            - name: DB_POSTGRESDB_DATABASE
              value: "${N8N_DB_POSTGRESDB_DATABASE}"
            - name: DB_POSTGRESDB_USER
              value: "${N8N_DB_POSTGRESDB_USER}"
            - name: DB_POSTGRESDB_PASSWORD
              value: "${N8N_DB_POSTGRESDB_PASSWORD}"
            - name: N8N_EDITOR_BASE_URL
              value: "${N8N_EDITOR_BASE_URL}"
            - name: WEBHOOK_URL
              value: "${N8N_WEBHOOK_URL}"
            - name: N8N_TRUSTED_HOSTS
              value: "${N8N_TRUSTED_HOSTS}"
            - name: N8N_DEFAULT_BINARY_DATA_MODE
              value: "${N8N_DEFAULT_BINARY_DATA_MODE}"
            - name: N8N_USER_MANAGEMENT_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: n8n-sec
                  key: jwt-secret
            - name: N8N_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: n8n-sec
                  key: encryption-key
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "1024Mi"
              cpu: "1000m"
          volumeMounts:
            - name: n8n-storage
              mountPath: /home/node/.n8n
              subPath: data
            - name: n8n-storage
              mountPath: /opt/custom-certificates
              subPath: trusted-certs
      volumes:
        - name: n8n-storage
          hostPath:
            path: "${target_deploy_path_local}/noctia-n8n"
---
apiVersion: v1
kind: Service
metadata:
  name: ${app_name}-n8n-pgres
spec:
  selector:
    app: ${app_name}-n8n-pgres
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: ${app_name}-n8n
spec:
  type: ClusterIP
  clusterIP: 10.96.50.7
  selector:
    app: ${app_name}-n8n
  ports:
    - port: 5678
      targetPort: 5678
---
apiVersion: v1
kind: Secret
metadata:
  name: ${app_name}-n8n-sec
type: Opaque
stringData:
  jwt-secret: "${n8n_sec_jwt}"
  encryption-key: "${n8n_sec_enc}"
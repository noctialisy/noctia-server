apiVersion: v1
kind: Service
metadata:
  name: ${app_name}-memcached
spec:
  selector:
    app: ${app_name}-memcached
  ports:
    - protocol: TCP
      port: 11211
      targetPort: 11211
---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${app_name}-memcached
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ${app_name}-memcached
  template:
    metadata:
      labels:
        app: ${app_name}-memcached
    spec:
      containers:
        - name: memcached
          image: ${memcached_image}
          args: ["-m", "256"]
          ports:
            - containerPort: 11211
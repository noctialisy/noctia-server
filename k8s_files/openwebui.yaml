apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${app_name}-openwebui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ${app_name}-openwebui
  template:
    metadata:
      labels:
        app: ${app_name}-openwebui
    spec:
      containers:
        - name: ${app_name}-openwebui
          image: ${openwebui_image}
          ports:
            - containerPort: 8080
          #env:
          #  - name: gpus
          #    value: "all"
          #  - name: gpus
          #    value: "all"
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "1024Mi"
              cpu: "1000m"
          volumeMounts:
            - name: storage
              mountPath: /app/backend/data
              subPath: data
      volumes:
        - name: storage
          hostPath:
            path: ${target_deploy_path_local}/openwebui
---
apiVersion: v1
kind: Service
metadata:
  name: ${app_name}-openwebui
spec:
  type: ClusterIP
  clusterIP: 10.96.50.9
  selector:
    app: ${app_name}-openwebui
  ports:
    - name: "http"
      protocol: TCP
      port: 8080
      targetPort: 8080